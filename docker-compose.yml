# Run everything locally: `docker compose up --build`, then open http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: typeface
      POSTGRES_PASSWORD: typeface
      POSTGRES_DB: typeface_hub
    ports:
      - "5432:5432" # also lets `npm run dev` on your machine use this database
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U typeface -d typeface_hub"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://typeface:typeface@db:5432/typeface_hub
      # Leave empty to have a random secret generated and kept in the font-files volume.
      AUTH_SECRET: ${AUTH_SECRET:-}
      # Email for password resets (optional; without it reset links go to `docker compose logs app`).
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
      GOOGLE_FONTS_API_KEY: ${GOOGLE_FONTS_API_KEY:-}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
    ports:
      - "3000:3000"
    volumes:
      - font-files:/app/.data # uploaded masters and generated font files

volumes:
  db-data:
  font-files:
